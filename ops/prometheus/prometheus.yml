global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: sourcebound-api
    metrics_path: /api/v1/metrics
    scrape_interval: 30s
    static_configs:
      - targets: [api:8000]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
