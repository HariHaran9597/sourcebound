[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "sourcebound-api"
version = "0.1.0"
description = "API for the Sourcebound enterprise knowledge copilot"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic-settings>=2.7,<3",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
    "python-multipart>=0.0.20,<1",
    "celery>=5.6,<6",
    "kombu>=5.4,<6",
    "docling>=2.0,<3",
    "qdrant-client[fastembed]>=1.14.2,<2",
    "fastembed>=0.4.2,<1",
    "httpx>=0.28,<1",
    "alembic>=1.14,<2",
    "PyJWT[crypto]>=2.10,<3",
    "prometheus-client>=0.21,<1",
    "opentelemetry-api>=1.45.1,<2",
    "opentelemetry-sdk>=1.45.1,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sourcebound_api"]

[tool.ruff]
line-length = 100
target-version = "py311"
